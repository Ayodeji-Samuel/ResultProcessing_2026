<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Expired</title>
  <script src="{{ url_for('static', filename='css/tailwind.min.js') }}"></script>
  <link href="{{ url_for('static', filename='css/remixicon.css') }}" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:{600:'#0284c7'}}}}}</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-red-50 via-white to-orange-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-100 mb-5">
      <i class="ri-link-unlink-m text-5xl text-red-400"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Attendance Link Closed</h1>
    <p class="text-gray-500 text-sm">{{ reason or 'This attendance link has expired or been revoked by the organiser.' }}</p>
    <p class="mt-6 text-xs text-gray-400">Please contact the meeting organiser if you believe this is an error.</p>
  </div>
</body>
</html>
